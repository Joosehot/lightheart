<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightheart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="board-wrap" id="boardWrap">
  <div class="board" id="board"></div>
</main>
<!-- the same notes, seen another way (Post-it, Notes, Comic); the scrapbook board above is the default -->
<main class="alt-view" id="altView" hidden></main>
<nav class="views" id="views" aria-label="View">
  <button data-view="scrapbook" class="on">✂️ Scrapbook</button>
  <button data-view="postit">🟨 Post-it</button>
  <button data-view="notes">📝 Notes</button>
</nav>
<button class="ideas-toggle" id="ideasToggle" title="Your ideas and past chats" aria-label="Your ideas and past chats">☰</button>
<aside class="ideas" id="ideas" hidden>
  <div class="ideas-head"><h2>Ideas</h2><button class="close" id="ideasClose" aria-label="Close">×</button></div>
  <button class="new-idea" id="newIdea">＋ New idea</button>
  <div class="idea-list" id="ideaList"></div>
</aside>
<header class="brand">
  <h1>Lightheart</h1>
  <p>a box for your ideas</p>
</header>
<div class="board-tools">
  <button id="bookBtn" title="Turn your ideas into a comic book you can read">📖 comic book</button>
  <button id="addCard" title="A blank card to fill in yourself">＋ blank card</button>
  <a href="/api/export" download="lightheart-board.json" class="tool-link">export</a>
</div>
<section class="island" id="island">
  <button class="fold" id="fold" title="Hide or show the conversation" aria-label="Hide or show the conversation">⌄</button>
  <div class="messages" id="messages"></div>
  <form class="composer" id="composer">
    <button type="button" class="mic" id="mic" title="Speak (click again to stop)" aria-label="Speak">🎤</button>
    <textarea id="input" rows="1" placeholder="What's on your mind?" autocomplete="off"></textarea>
    <button type="submit" id="send" aria-label="Send">Send</button>
  </form>
  <div class="voice-row">
    <button type="button" class="voice-btn" id="voiceMode" title="Voice mode: it reads its replies aloud and listens again, like a call">🔈 voice mode off</button>
    <button type="button" class="voice-btn" id="voiceLang" title="The language you speak">fi</button>
    <span class="voice-note" id="voiceNote"></span>
  </div>
</section>
<div class="popover" id="popover" hidden></div>
<div class="toast" id="toast" hidden></div>

<!-- the comic book: making one, the shelf, the reader -->
<div class="shade" id="bookMaker" hidden>
  <div class="sheet">
    <button class="close" data-close aria-label="Close">×</button>
    <h2>Make a comic book</h2>
    <p class="muted">Your ideas become a short comic you can read: a story, panels, speech bubbles, real pictures.</p>
    <div class="field"><span>Which ideas? <button type="button" class="link" id="pickAll">all</button> · <button type="button" class="link" id="pickNone">none</button></span>
      <div class="picks" id="bookPicks"></div>
    </div>
    <label class="field"><span>The story: what should it be like? <em>(optional)</em></span>
      <textarea id="bookWish" rows="2" placeholder="e.g. a quiet bedtime story, or a funny one with a twist at the end"></textarea>
    </label>
    <div class="field"><span>The pictures: art style</span>
      <div class="arts" id="bookArts"></div>
      <textarea id="bookArt" rows="2" placeholder="or describe your own: e.g. moody blue ink with gold highlights, thick brush lines, 1970s sci-fi paperback"></textarea>
    </div>
    <label class="field"><span>Pages</span>
      <input type="range" id="bookPages" min="1" max="6" value="4"> <b id="bookPagesN">4</b>
    </label>
    <p class="estimate" id="bookEstimate"></p>
    <div class="err" id="bookErr"></div>
    <div class="sheet-row">
      <button class="primary" id="bookGo">Write and draw it</button>
    </div>
    <div class="shelf" id="shelf"></div>
  </div>
</div>
<div class="reader" id="reader" hidden>
  <div class="reader-top">
    <button class="ghost" id="readerShelf">‹ shelf</button>
    <span id="readerTitle"></span>
    <span class="muted" id="readerStatus"></span>
    <button class="ghost close" id="readerClose" aria-label="Close">×</button>
  </div>
  <div class="spread" id="spread"></div>
  <div class="reader-nav">
    <button class="turn" id="prevPage" aria-label="Previous page">‹</button>
    <span id="pageNo"></span>
    <button class="turn" id="nextPage" aria-label="Next page">›</button>
  </div>
</div>
<script src="/static/app.js"></script>
<script src="/static/book.js"></script>
<script src="/static/voice.js"></script>
<script src="/static/views.js"></script>
<script src="/static/ideas.js"></script>
</body>
</html>
