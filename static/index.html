<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightheart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="chat">
    <header class="brand">
      <h1>Lightheart</h1>
      <p>a box for your ideas</p>
    </header>
    <div class="messages" id="messages"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="2" placeholder="What's on your mind?" autocomplete="off"></textarea>
      <button type="submit" id="send" aria-label="Send">Send</button>
    </form>
  </aside>
  <main class="board-wrap" id="boardWrap">
    <div class="board-tools">
      <button id="addCard" title="A blank card to fill in yourself">＋ blank card</button>
      <a href="/api/export" download="lightheart-board.json" class="tool-link">export</a>
    </div>
    <div class="board" id="board"></div>
  </main>
</div>
<div class="popover" id="popover" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
